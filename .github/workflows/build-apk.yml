name: Compilar APK Lista de Compras

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "No se encontro settings.gradle. Subi el contenido del zip DESCOMPRIMIDO al repositorio."
            exit 1
          fi
          cd "$(dirname "$F")"
          echo "Proyecto en: $(pwd)"
          echo "=== ARCHIVOS ==="
          find . -type f -not -path "./.git/*" -not -path "./.gradle/*" | sort | head -40
          echo "================"
          if [ ! -f app/build.gradle ]; then echo "FALTA app/build.gradle: la carpeta app no se subio"; exit 1; fi
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ListaDeCompras-APK
          path: '**/build/outputs/apk/debug/*.apk'
